    crossorigin="anonymous"></script>

  <script src="./constant.js"></script>
  <script src="./src/tts.js"></script>
</head>

<body onload="getData()">
  <nav id="myNavbar" class="navbar navbar-expand-lg" style="background-color: #00569d">
    <div style="display: flex; flex: 1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer" id="backButton" viewBox="0 0 16 16">

          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>

      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px">Dialogue Practice</a>
    </div>

    <div class="ml-auto" style="display: flex; align-items: center;">
      <div style="margin-left: auto;align-self: center;display: flex;align-items: center;justify-content: center;">
        <svg id="typeItIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" class="bi bi-keyboard" viewBox="0 0 16 16"
          style="margin-right: 12px; cursor: pointer; display: none;" onclick="replaceStateWithHistory('TypeIt.html')">

        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" class="bi bi-plus-lg"
          onclick="replaceStateWithHistory('addNew.html')" viewBox="0 0 16 16"
          style="margin-right: 12px;font-weight: 800;cursor: pointer;">
          <path fill-rule="evenodd"
            d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z" />
        </svg>
      </div>
    </div>
  </nav>

  <div class="dropdown-class" style="
        display: flex;
        align-items: center;
        margin-top: 20px;
        justify-content: center;
        flex-direction: column;
      ">
    <br />

    <div class="custom-dropdown">
      <select class="dialogue-list-custom-dropdown-select main-custom-button"></select>
      <span class="custom-dropdown-arrow"></span>
    </div>

    <br />

    <div style="
          display: flex;
          flex-direction: row;
          align-items: center;
          gap: 10px;
          justify-content: space-between;
          max-width: 34rem;
          width: 85%;
        ">
      <div style="">
        <input type="checkbox" id="toggle_tts" />
        <label for="toggle_tts" class="prevent-select">TTS</label>
      </div>

      <div style="
            display: flex;
            align-items: center;
            min-height: 30px;
            flex-direction: column;
          " id="delay_container">
        <label for="delay1" class="prevent-select" style="margin-right: 5px; margin-top: 2.5px">Int., sec:
        </label>
        <input type="number" id="delay_input1" autocomplete="off" min="0" max="99" placeholder="Delay"
          style="width: 65px" pattern="[0-9]" />
      </div>

      <div style="
            display: flex;
            align-items: center;
            min-height: 30px;
            justify-content: flex-end;
            flex-direction: column;
          " id="delay_container">
        <label for="delay2" class="prevent-select" style="margin-right: 5px; margin-top: 2.5px">Ext., sec:
        </label>
        <input type="number" id="delay_input2" autocomplete="off" min="0" max="99" placeholder="Delay"
          style="width: 65px" pattern="[0-9]" />
      </div>
    </div>

    <br />

    <div id="sentencesContainer" class="sentences-container"></div>

    <p id="dialogIDText"></p>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLongTitle">Add New</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="addData-Form">
            <div class="form-group">
              <label for="source">Source</label>
              <input type="text" class="form-control" id="source" value="" required>
            </div>
            <div class="form-group">
              <label for="target">Target</label>
              <input type="text" class="form-control" id="target" value="" required>
            </div>
            <div class="form-group">
              <label for="targetNote">Note</label>
              <input type="text" class="form-control" id="targetNote" value="">
            </div>

            <div class="form-row d-flex justify-content-around align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="favourite">
                <label class="form-check-label" for="favourite">Favourite</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="skip">
                <label class="form-check-label" for="skip">Skip</label>
              </div>
            </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" id="cancelButton">Cancel</button>
          <button class="btn btn-primary" style="width: 50%;" type="submit" id="submitButton">Add</button>
        </div>
        </form>
      </div>
    </div>
  </div>
  <div id="snackbar"></div>

  <!-- Loading Modal -->

  <div class="modal fade" id="modal-loading" data-backdrop="static">
    <div class="modal-dialog modal-sm modal-dialog-centered" style="max-width: 150px; margin: 0 auto">
      <div class="modal-content">
        <div class="modal-body text-center" style="
              display: flex;
              flex-direction: row;
              align-items: center;
              justify-content: center;
              gap: 12px;
            ">
          <div class="loading-spinner"></div>
          <div>Loading</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./src/displayToast.js"></script>
  <script src="./src/dialoguePlayer.js"></script>
  <script src="./src/api.js"></script>
  <script src="./src/tts.js"></script>
</body>

</html>
