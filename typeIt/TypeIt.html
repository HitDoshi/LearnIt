        // --- In the app: SpeechRecognition-like wrapper around the native dialogue mic ---
        // Uses the app's existing startMicDialogue / stopMicDialogue channel calls; the wrapper relays
        // the app's onDialogueMic* callbacks here. The final transcript is still judged by fuzzyMatch().
        function createAppRecognition(){
            let active = false;
            let lastHeard = '';
            const rec = { lang: TARGET_LANG_LOCALE, onstart: null, onresult: null, onerror: null, onend: null };
            const stop = () => { active = false; postToApp('stopMicDialogue', []); };
            const finish = (transcript) => {
                if(!active) return;
                stop();
                if(rec.onresult) rec.onresult({ results: [[{ transcript: transcript || '' }]] });
                if(rec.onend) rec.onend();
            };

            rec.start = function(){
                lastHeard = '';
                active = true;
                const expected = L2_SPEAK.currentWordObj ? L2_SPEAK.currentWordObj.source : '';
                postToApp('startMicDialogue', [rec.lang, JSON.stringify([{ id: 'typeit', value: expected }])]);
                if(rec.onstart) rec.onstart();
            };
            rec.abort = function(){
                if(!active) return;
                stop();
                if(rec.onerror) rec.onerror({ error: 'aborted' });
                if(rec.onend) rec.onend();
            };

            appMessageHandlers.micHeard = function(data){
                if(!active) return;
                lastHeard = String(data.text || '');
                setSpeakInputState('listening', `🎤 ${lastHeard}`);
            };
            appMessageHandlers.micMatch = function(){ finish(lastHeard); };
            appMessageHandlers.micNoMatch = function(data){ finish(String(data.text || lastHeard)); };
            // Sent when listening ended without a final result (silence / STT error)
            appMessageHandlers.micPaused = function(){
                if(!active) return;
                stop();
                if(rec.onerror) rec.onerror({ error: 'no-speech' });
                if(rec.onend) rec.onend();
            };
            return rec;
        }

        // --- ASR & Event Handling for Speak Mode ---
        function initRecognition(){
            if(!speechSupported) return;
            try {
                recognition = IN_APP ? createAppRecognition() : new SpeechRecognitionAPI();
                recognition.lang = TARGET_LANG_LOCALE;
                recognition.interimResults = false;
                recognition.continuous = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    isListening = true;
                    setSpeakInputState('listening', '🎤 Listening...');
                    micBtn.textContent = '⏹ Stop';
                    micBtn.classList.add('listening');
                };

                recognition.onresult = (event) => {
                    let transcript = '';
                    try { transcript = event.results[0][0].transcript || ''; } catch(e){ transcript = ''; }
                    handleRecognitionResult(transcript);
                };

                recognition.onerror = (event) => {
                    isListening = false;
                    micBtn.textContent = '🎤 Speak';
                    micBtn.classList.remove('listening');
                    if(event.error === 'not-allowed'){
                        setSpeakInputState('fail', '⚠️ Microphone permission denied');
                    } else if(event.error === 'no-speech'){
                        setSpeakInputState('idle', '🔇 Nothing heard. Try again.');
                    } else if(event.error === 'aborted'){
                        setSpeakInputState('idle', SPEAK_PROMPT);
                    } else {
                        setSpeakInputState('idle', '⚠️ Speech error: ' + event.error);
                    }
                };

                recognition.onend = () => {
                    isListening = false;
                    micBtn.textContent = '🎤 Speak';
                    micBtn.classList.remove('listening');
                };
            } catch(e){
                recognition = null;
            }
        }

        function handleRecognitionResult(transcript){
            if(!L2_SPEAK.currentWordObj) return;
            const expected = L2_SPEAK.currentWordObj.source;
            const heard = (transcript || '').trim();

            speakAttempts++;

            if(!heard){
                setSpeakInputState('fail', '🔇 Nothing heard. Try again.');
                updateSpeakAccuracy();
                return;
            }

            const matched = fuzzyMatch(heard, expected);

            if(matched){
                speakSuccesses++;
                setSpeakInputState('pass', `"${heard}"`, '✓');
                correctCounts.speak++;
                updateCorrectDisplay();

                L2_SPEAK.waitingForExclusion = true;
                if(L2_SPEAK.exclusionTimer) clearTimeout(L2_SPEAK.exclusionTimer);
                L2_SPEAK.exclusionTimer = setTimeout(() => {
                    L2_SPEAK.waitingForExclusion = false;
                }, 800);
            } else {
                setSpeakInputState('fail', `"${heard}"`, '✗');
            }
            updateSpeakAccuracy();
        }

        function startListening(){
            if(!recognition) return;
            if(isListening){
                try { recognition.abort(); } catch(e){}
                return;
            }
            setSpeakInputState('listening', '🎤 Listening...');
            try { recognition.start(); } catch(e){
                try { recognition.abort(); } catch(e2){}
                setTimeout(() => { try { recognition.start(); } catch(e3){} }, 100);
            }
        }

        function revealSpeakAnswer(){
            if(!L2_SPEAK.currentWordObj) return;
            if(isListening && recognition){ try { recognition.abort(); } catch(e){} }
            setSpeakInputState('revealed', L2_SPEAK.currentWordObj.source, '👁️');
            speak(L2_SPEAK.currentWordObj.source);
        }

        function nextSpeakPair(){
            if(L2_SPEAK.completed) return;
            if(!L2_SPEAK.currentWordObj) return;
            if(isListening && recognition){ try { recognition.abort(); } catch(e){} }
            speak(L2_SPEAK.currentWordObj.source);
            generateNextSpeakLine();
        }

        function executeSpeakDrop() {
            if(!L2_SPEAK.currentWordObj) return;
            const idx = L2_SPEAK.pool.indexOf(L2_SPEAK.currentWordObj);
            if(idx > -1) L2_SPEAK.pool.splice(idx, 1);
            L2_SPEAK.removed++;
            if(L2_SPEAK.extraSlots>0) L2_SPEAK.extraSlots--;
            updateSpeakCirculation();
            updateProgressBar(getSpeakProgress());
            setSpeakInputState('idle', `🗑️ Excluded! (${getSpeakRemaining()} left)`);
            if(L2_SPEAK.exclusionTimer){ clearTimeout(L2_SPEAK.exclusionTimer); L2_SPEAK.exclusionTimer=null; }
            L2_SPEAK.waitingForExclusion = false;
            setTimeout(generateNextSpeakLine, 500);
        }

        function flashSpeakMessage(text, ms){
            setSpeakInputState('idle', text);
            setTimeout(() => { setSpeakInputState('idle', SPEAK_PROMPT); }, ms);
        }

        function handleSpeakKeydown(e, overrideKey = null){
            const key = overrideKey !== null ? overrideKey : e.key;

            if(L2_SPEAK.completed){
                if(key === 'Enter'){
                    e.preventDefault();
                    initSpeak();
                    generateNextSpeakLine();
                }
                return;
            }

            if(key === ' '){ e.preventDefault(); startListening(); return; }
            if(key === 'Tab'){ e.preventDefault(); return; }

            if(key === '/'){
                e.preventDefault();
                if(speakNextSlashTimer){
                    clearTimeout(speakNextSlashTimer);
                    speakNextSlashTimer = null;
                    nextSpeakPair();
                } else {
                    speakNextSlashTimer = setTimeout(() => { speakNextSlashTimer = null; }, 800);
                }
                return;
            }

            if(key==='>'){
                if(!L2_SPEAK.waitingForExclusion){
                    if(l2_expandTimer){
                        clearTimeout(l2_expandTimer); l2_expandTimer=null;
                        if(L2_SPEAK.extraSlots<40 && L2_SPEAK.reservoir.length>0){
                            L2_SPEAK.extraSlots++;
                            refillL2SpeakPool();
                            updateSpeakCirculation();
                            flashSpeakMessage(`🔽 Deck expanded (40+${L2_SPEAK.extraSlots})`, 500);
                        } else {
                            flashSpeakMessage(`⚠️ ${L2_SPEAK.extraSlots>=40?'Max extra slots reached':'No more words to add'}`, 500);
                        }
                        e.preventDefault(); return;
                    } else { l2_expandTimer=setTimeout(()=>{ l2_expandTimer=null; },500); e.preventDefault(); return; }
                }
            }

            if(key === '+'){
                if(!L2_SPEAK.waitingForExclusion){
                    if(l2_priorityDoubleTimer){
                        clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null;
                        if(L2_SPEAK.currentWordObj){
                            if(L2_SPEAK.currentWordObj.priority < 5){
                                L2_SPEAK.currentWordObj.priority++;
                                L2_SPEAK.priority=L2_SPEAK.currentWordObj.priority;
                                updateL2SpeakColor(); updateL2SpeakStatus();
                                flashSpeakMessage(`🔺 Priority +1 (now ${L2_SPEAK.currentWordObj.priority})`, 500);
                            } else {
                                flashSpeakMessage('⚠️ Priority already max (5)', 300);
                            }
                        }
                        e.preventDefault(); return;
                    } else {
                        l2_priorityDoubleTimer = setTimeout(()=>{ l2_priorityDoubleTimer=null; }, 500);
                        e.preventDefault();
                    }
                }
            }

            if(key === '-'){
                if(!L2_SPEAK.waitingForExclusion){
                    if(l2_priorityDoubleTimer){
                        clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null;
                        if(L2_SPEAK.currentWordObj){
                            if(L2_SPEAK.currentWordObj.priority > 0){
                                L2_SPEAK.currentWordObj.priority--;
                                L2_SPEAK.priority=L2_SPEAK.currentWordObj.priority;
                                updateL2SpeakColor(); updateL2SpeakStatus();
                                flashSpeakMessage(`🔻 Priority -1 (now ${L2_SPEAK.currentWordObj.priority})`, 500);
                            } else {
                                flashSpeakMessage('⚠️ Priority already minimum (0)', 300);
                            }
                        }
                        e.preventDefault(); return;
                    } else {
                        l2_priorityDoubleTimer = setTimeout(()=>{ l2_priorityDoubleTimer=null; }, 500);
                        e.preventDefault();
                    }
                }
            }

            if(key === '?'){
                if(!L2_SPEAK.waitingForExclusion){
                    if(l2_priorityDoubleTimer){
                        clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null;
                        revealSpeakAnswer();
                        e.preventDefault(); return;
                    } else {
                        l2_priorityDoubleTimer = setTimeout(()=>{ l2_priorityDoubleTimer=null; }, 500);
                        e.preventDefault();
                    }
                }
            }

            if(key !== '+' && key !== '-' && key !== '?' && key !== '/'){
                if(l2_priorityDoubleTimer){ clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null; }
            }
            if(key !== '>'){ if(l2_expandTimer){ clearTimeout(l2_expandTimer); l2_expandTimer=null; } }

            if(key === '.'){
                if(L2_SPEAK.waitingForExclusion){
                    if(L2_SPEAK._dotPressed){
                        clearTimeout(L2_SPEAK._dotPressed);
                        L2_SPEAK._dotPressed = null;
                        executeSpeakDrop();
                    } else {
                        L2_SPEAK._dotPressed = setTimeout(()=>{ L2_SPEAK._dotPressed=null; }, 500);
                        setSpeakInputState('pass', `✅ ${L2_SPEAK.currentWordObj.source} | Press '.' to exclude`, '✓');
                    }
                }
                e.preventDefault(); return;
            }
        }

        // ============================================================
        // RECALL – LEVEL 2 HELPERS
        // ============================================================
        function refillL2Pool(mode){
            const extraSlots = mode==='passive' ? L2_PASSIVE.extraSlots : L2_ACTIVE.extraSlots;
            const poolMax = 40 + extraSlots;
            let pool, reservoir;
            if(mode==='passive'){ pool=L2_PASSIVE.pool; reservoir=L2_PASSIVE.reservoir; }
            else{ pool=L2_ACTIVE.pool; reservoir=L2_ACTIVE.reservoir; }
            while(pool.length<poolMax && reservoir.length>0) pool.push(reservoir.shift());
        }
        function getL2Remaining(mode){
            if(mode==='passive') return L2_PASSIVE.pool.length + L2_PASSIVE.reservoir.length;
            return L2_ACTIVE.pool.length + L2_ACTIVE.reservoir.length;
        }
        function getL2Progress(mode){
            const state = mode==='passive' ? L2_PASSIVE : L2_ACTIVE;
            const total = state.total || 1;
            return Math.min(100, (state.removed/total)*100);
        }
        function selectWeightedL2Word(mode){
            const pool = mode==='passive' ? L2_PASSIVE.pool : L2_ACTIVE.pool;
            if(!pool.length) return null;
            return weightedRandomPick(pool, item=>1+(item.priority||0)*2);
        }
        function updateL2RecallColor(state){
            if(!state||!state.currentWordObj)return;
            const p=state.currentWordObj.priority||0;
            let color='var(--text-main)';
            if(p>=4)color='var(--priority-red)';
            else if(p===3)color='var(--priority-yellow)';
            sourceTextContainer.style.color=color;
        }
        function updateL2RecallStatus(state, effectiveMode){
            if(!state||!state.currentWordObj)return;
            const p=state.currentWordObj.priority||0;
            const modeLabel = effectiveMode === 'passive' ? 'Passive' : 'Active';
            statusContent.textContent=`Mode: ${modeLabel} | Priority: ${p} | Type '??' for hint | Type '>>' to increase deck | Type '<<' for context | Type '++' / '--' to change priority`;
        }
        function updateRecallCirculation(mode){
            const state = mode==='passive' ? L2_PASSIVE : L2_ACTIVE;
            const remaining=getL2Remaining(mode);
            const extra=state.extraSlots||0;
            circulationContent.textContent=`Deck: 40(+${extra}) | Remaining: ${remaining}/${state.total} | Removed: ${state.removed}`;
        }

        function initL2Passive(){
            const pairs = L2_TEST_PAIRS.map(p=>({source:p.source,target:p.target,priority:0}));
            L2_PASSIVE.reservoir=shuffleArray(pairs.slice());
            L2_PASSIVE.total=pairs.length;
            L2_PASSIVE.removed=0;
            L2_PASSIVE.pool=[];
            L2_PASSIVE.completed=false;
            L2_PASSIVE.waitingForExclusion=false;
            L2_PASSIVE.currentWordObj=null;
            L2_PASSIVE.priority=0;
            L2_PASSIVE.questionCount=0;
            L2_PASSIVE.extraSlots=0;
            if(L2_PASSIVE.exclusionTimer){ clearTimeout(L2_PASSIVE.exclusionTimer); L2_PASSIVE.exclusionTimer=null; }
            refillL2Pool('passive');
        }
        function initL2Active(){
            const pairs = L2_TEST_PAIRS.map(p=>({source:p.source,target:p.target,priority:0}));
            L2_ACTIVE.reservoir=shuffleArray(pairs.slice());
            L2_ACTIVE.total=pairs.length;
            L2_ACTIVE.removed=0;
            L2_ACTIVE.pool=[];
            L2_ACTIVE.completed=false;
            L2_ACTIVE.waitingForExclusion=false;
            L2_ACTIVE.currentWordObj=null;
            L2_ACTIVE.priority=0;
            L2_ACTIVE.questionCount=0;
            L2_ACTIVE.extraSlots=0;
            if(L2_ACTIVE.exclusionTimer){ clearTimeout(L2_ACTIVE.exclusionTimer); L2_ACTIVE.exclusionTimer=null; }
            refillL2Pool('active');
        }

        // ============================================================
        // CONTEXT LIST (Recall Only)
        // ============================================================
        function showContextList(){
            if(!currentSearchWord){ contextList.style.display='none'; return; }
            const matches = L2_ALL_PAIRS.map(p => p.source)
                .filter(t => t.includes(currentSearchWord) && t !== currentSearchWord)
                .slice(0, 30);
            const unique = [...new Set(matches)];
            if(unique.length===0){
                contextList.innerHTML = '<div class="item empty">No other phrases found</div>';
                contextList.style.display='block';
                return;
            }
            const highlight = `<span class="highlight">${escapeHtml(currentSearchWord)}</span>`;
            const html = unique.map(phrase => `<div class="item">${phrase.split(currentSearchWord).map(escapeHtml).join(highlight)}</div>`).join('');
            contextList.innerHTML = html;
            contextList.style.display='block';
        }
        function hideContextList(){ contextList.style.display='none'; contextList.innerHTML=''; }
        function toggleContextList(){
            if(contextList.style.display==='block') hideContextList();
            else showContextList();
        }

        // ============================================================
        // DATA LOADING (LearnIt – replaces the file picker)
        // ============================================================
        // Reads a file bundled next to this page. In the app (file://) fetch() can't read bundled
        // files from this iframe, so the wrapper reads it through the app and sends the text back.
        async function fetchLocalText(path){
            if(IN_APP) return readTextViaApp(path);
            const response = await fetch(path);
            if(!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
        }

        async function autoLoadTypingItems(){
            try {
                const text = await fetchLocalText(TYPING_ITEMS_URL);
                L2_TYPING_ITEMS = [...new Set(text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== ''))];
                console.log(`TypeIt: loaded ${L2_TYPING_ITEMS.length} typing items`);
            } catch(err){
                console.warn('TypeIt: typing practice auto-load failed:', err);
                L2_TYPING_ITEMS = [];
            } finally {
                typingItemsLoading = false;
            }
        }

        // All records of the current subject/topic deck
        function readDeckFromIndexedDB(){
            return new Promise((resolve) => {
                try {
                    const subject = parseInt(readStoredJson('source-language')?.id || 1);
                    const targetSubjectId = parseInt(TARGET_LANG?.id || 1);
                    const topic = parseInt(localStorage.getItem('topic') || '0');

                    const dbName = topic == 0 ? 'user' : 'test';
                    const storeName = topic == 0 ? 'userData' : 'data';
                    const keyIndex = topic == 0 ? 'subjectIndex' : 'subjectTopicIndex';

                    const idb = window.indexedDB || window.mozIndexedDB || window.webkitIndexedDB || window.msIndexedDB;
                    if(!idb){ resolve([]); return; }
                    const openReq = idb.open(dbName, 1);

                    // Never create the database from here – the quiz pages own its schema
                    openReq.onupgradeneeded = (ev) => { try { ev.target.transaction.abort(); } catch(e){} };
                    openReq.onerror = () => { console.warn('TypeIt: IndexedDB open failed'); resolve([]); };
                    openReq.onsuccess = (event) => {
                        const db = event.target.result;
                        try {
                            const store = db.transaction(storeName, 'readonly').objectStore(storeName);
                            const range = topic == 0
                                ? IDBKeyRange.only([subject, targetSubjectId])
                                : IDBKeyRange.only([subject, targetSubjectId, topic]);
                            const getAllReq = store.index(keyIndex).getAll(range);
                            getAllReq.onsuccess = (ev) => { resolve(ev.target.result || []); db.close(); };
                            getAllReq.onerror = () => { console.warn('TypeIt: IndexedDB query failed'); resolve([]); db.close(); };
                        } catch(err){
                            console.warn('TypeIt: IndexedDB read failed:', err);
                            db.close();
                            resolve([]);
                        }
                    };
                } catch(err){
                    console.error('TypeIt: IndexedDB load error:', err);
                    resolve([]);
                }
            });
        }

        // LearnIt stores the language being learned in `target` and the known language in `source`.
        // The engine uses `source` for the foreign phrase (typed, spoken, read aloud) and `target` for its meaning.
        function toEnginePair(record){
            return { source: String(record?.target || '').trim(), target: String(record?.source || '').trim() };
        }
        function hasBothSides(p){ return !!(p.source && p.target); }
        function statusLetter(record){ return String(record?.status || '').toUpperCase().charAt(0); }

        async function loadPairsForContext(){
            let allPairs = [];
            let testPairs = [];
            try {
                if(TYPEIT_SOURCE === 'dialoguePlayer'){
                    const raw = localStorage.getItem('typeit_dialogue_sentences');
                    const list = raw ? JSON.parse(raw) : [];
                    allPairs = (Array.isArray(list) ? list : []).map(toEnginePair).filter(hasBothSides);
                    testPairs = allPairs;
                } else {
                    const records = (await readDeckFromIndexedDB()).filter(r => r && r.isSkip !== true);
                    allPairs = records.map(toEnginePair).filter(hasBothSides);
                    if(TYPEIT_SOURCE === 'matchPairs'){
                        // From Match Pairs: only Red, Yellow or Fav cards of the current deck (ShowInDays=0, not NS).
                        // The rest of the deck still feeds the '<<' context list.
                        testPairs = records
                            .filter(r => !r.isNS && r.showInDays === 0 && (statusLetter(r) === 'R' || statusLetter(r) === 'Y' || r.isFav === true))
                            .map(toEnginePair).filter(hasBothSides);
                    } else {
                        testPairs = allPairs;
                    }
                }
                console.log(`TypeIt: loaded ${testPairs.length} practice pairs (${allPairs.length} total, source: ${TYPEIT_SOURCE})`);
            } catch(err){
                console.error('TypeIt: could not load pairs:', err);
            }
            L2_ALL_PAIRS = allPairs;
            L2_TEST_PAIRS = testPairs;
            pairsLoading = false;
        }

        // ============================================================
        // GENERATE NEXT LINE (dispatch)
        // ============================================================
        function showRecallComplete(){
            sourceText=''; targetText='';
            typewriterRow.textContent='✅ RECALL COMPLETE. Press [Enter] to restart.';
            updateProgressBar(100);
        }

        function generateNextLine(){
            if(L2_ACTIVE_MODE === 'typing'){ generateNextTypingLine(); return; }
            if(L2_ACTIVE_MODE === 'drill'){ generateNextDrillLine(); return; }
            if(L2_ACTIVE_MODE === 'speak'){ generateNextSpeakLine(); return; }

            if(L2_PASSIVE.exclusionTimer){ clearTimeout(L2_PASSIVE.exclusionTimer); L2_PASSIVE.exclusionTimer=null; }
            L2_PASSIVE.waitingForExclusion=false; L2_PASSIVE.questionCount=0; L2_PASSIVE.currentWordObj=null;
            if(L2_ACTIVE.exclusionTimer){ clearTimeout(L2_ACTIVE.exclusionTimer); L2_ACTIVE.exclusionTimer=null; }
            L2_ACTIVE.waitingForExclusion=false; L2_ACTIVE.questionCount=0; L2_ACTIVE.currentWordObj=null;
            if(l2_priorityTimer){ clearTimeout(l2_priorityTimer); l2_priorityTimer=null; }
            if(l2_expandTimer){ clearTimeout(l2_expandTimer); l2_expandTimer=null; }
            if(l2_contextTimer){ clearTimeout(l2_contextTimer); l2_contextTimer=null; }
            if(l2_priorityDoubleTimer){ clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null; }
            hideContextList();

            showTranslation(null);
            sourceTextContainer.classList.remove('recall-mode');
            sourceTextContainer.style.color='';

            if(!L2_TEST_PAIRS.length){
                sourceText=''; targetText='';
                resetTelemetryState();
                typewriterRow.textContent = emptyPairsMessage();
                statusContent.textContent = emptyPairsStatus();
                circulationContent.textContent = `0 ${pairUnit()}`;
                sourceTextContainer.innerHTML='';
                updateProgressBar(0);
                return;
            }

            let effectiveMode;
            if(L2_ACTIVE_MODE === 'random') effectiveMode = Math.random() < 0.5 ? 'passive' : 'active';
            else effectiveMode = L2_ACTIVE_MODE;
            currentEffectiveMode = effectiveMode;

            const state = effectiveMode === 'passive' ? L2_PASSIVE : L2_ACTIVE;

            if(state.completed){ showRecallComplete(); return; }
            let remaining = getL2Remaining(effectiveMode);
            if(remaining===0){ state.completed=true; showRecallComplete(); return; }
            if(state.pool.length===0){
                refillL2Pool(effectiveMode);
                remaining=getL2Remaining(effectiveMode);
                if(remaining===0){ state.completed=true; showRecallComplete(); return; }
            }
            const word = selectWeightedL2Word(effectiveMode);
            if(!word){ state.completed=true; showRecallComplete(); return; }

            state.currentWordObj = word;
            state.priority = word.priority||0;

            if(effectiveMode === 'passive'){
                sourceText = word.source;
                targetText = word.target;
            } else {
                sourceText = word.target;
                targetText = word.source;
            }

            currentForeignWord = word.source;
            currentNativeWord = word.target;
            currentSearchWord = stripArticle(word.source);

            typewriterRow.textContent='';
            const progressPct = getL2Progress(effectiveMode);
            updateL2RecallStatus(state, effectiveMode);
            updateRecallCirculation(effectiveMode);
            updateProgressBar(progressPct);
            sourceTextContainer.classList.add('recall-mode');
            updateL2RecallColor(state);

            resetTelemetryState();
            renderSourceSheetDisplay();
            hideContextList();
        }

        function resetTelemetryState(){
            currentIndex=0;
            isErrorState=false;
            currentTypedString='';
            startTime=null;
            totalKeystrokes=0;
            errorCount=0;
            lineWpm=0;
            lineAcc=100;
            if(L2_ACTIVE_MODE !== 'speak') {
                accuracyDisplay.textContent='100%';
            }
            if(wpmDisplay) wpmDisplay.textContent='0';
            if(L2_ACTIVE_MODE !== 'speak') typewriterRow.textContent='⏎ Start typing...';
            showTranslation(null);
        }

        function renderSourceSheetDisplay(){
            sourceTextContainer.innerHTML='';
            if(!sourceText){
                const span=document.createElement('span');
                span.textContent='No items loaded';
                span.className='char-untyped';
                sourceTextContainer.appendChild(span);
                return;
            }
            for(let i=0;i<sourceText.length;i++){
                const span=document.createElement('span');
                span.textContent=sourceText[i];
                span.className='char-untyped';
                sourceTextContainer.appendChild(span);
            }
            updateSourceSheetStyles();
        }

        function calculateTelemetryMetrics(){
            if(totalKeystrokes===0)return;
            lineAcc=Math.max(0,((totalKeystrokes-errorCount)/totalKeystrokes)*100);
            accuracyDisplay.textContent=lineAcc.toFixed(1)+'%';
        }

        // ============================================================
        // RECALL KEYBOARD HANDLER
        // ============================================================
        function restoreTypewriterAfter(ms){
            setTimeout(()=>{ typewriterRow.textContent = currentTypedString || "⏎ Start typing..."; }, ms);
        }

        function handleRecallKeydown(e, overrideKey=null){
            const key = overrideKey!==null ? overrideKey : e.key;
            const effectiveMode = (L2_ACTIVE_MODE === 'random') ? currentEffectiveMode : L2_ACTIVE_MODE;
            const state = effectiveMode === 'passive' ? L2_PASSIVE : L2_ACTIVE;

            if(key==='>'){
                if(!state.waitingForExclusion && currentTypedString===''){
                    if(l2_expandTimer){
                        clearTimeout(l2_expandTimer); l2_expandTimer=null;
                        if(state.extraSlots<40 && state.reservoir.length>0){
                            state.extraSlots++;
                            refillL2Pool(effectiveMode);
                            updateRecallCirculation(effectiveMode);
                            typewriterRow.textContent=`🔽 Deck expanded (40+${state.extraSlots})`;
                        } else {
                            typewriterRow.textContent=`⚠️ ${state.extraSlots>=40?'Max extra slots reached':'No more words to add'}`;
                        }
                        restoreTypewriterAfter(500);
                        e.preventDefault(); return;
                    } else { l2_expandTimer=setTimeout(()=>{ l2_expandTimer=null; },500); e.preventDefault(); return; }
                }
            }
            if(key==='<'){
                if(!state.waitingForExclusion && currentTypedString===''){
                    if(l2_contextTimer){
                        clearTimeout(l2_contextTimer); l2_contextTimer=null;
                        toggleContextList(); e.preventDefault(); return;
                    } else { l2_contextTimer=setTimeout(()=>{ l2_contextTimer=null; },500); e.preventDefault(); return; }
                }
            }
            if(key === '+'){
                if(!state.waitingForExclusion){
                    if(l2_priorityDoubleTimer){
                        clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null;
                        if(state.currentWordObj){
                            if(state.currentWordObj.priority < 5){
                                state.currentWordObj.priority++;
                                state.priority=state.currentWordObj.priority;
                                updateL2RecallColor(state); updateL2RecallStatus(state, effectiveMode);
                                typewriterRow.textContent=`🔺 Priority +1 (now ${state.currentWordObj.priority})`;
                                restoreTypewriterAfter(500);
                            } else {
                                typewriterRow.textContent='⚠️ Priority already max (5)';
                                restoreTypewriterAfter(300);
                            }
                        }
                        e.preventDefault(); return;
                    } else {
                        l2_priorityDoubleTimer = setTimeout(()=>{ l2_priorityDoubleTimer=null; }, 500);
                        if(targetText[currentIndex] !== '+'){ e.preventDefault(); return; }
                    }
                }
            }
            if(key === '-'){
                if(!state.waitingForExclusion){
                    if(l2_priorityDoubleTimer){
                        clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null;
                        if(state.currentWordObj){
                            if(state.currentWordObj.priority > 0){
                                state.currentWordObj.priority--;
                                state.priority=state.currentWordObj.priority;
                                updateL2RecallColor(state); updateL2RecallStatus(state, effectiveMode);
                                typewriterRow.textContent=`🔻 Priority -1 (now ${state.currentWordObj.priority})`;
                                restoreTypewriterAfter(500);
                            } else {
                                typewriterRow.textContent='⚠️ Priority already minimum (0)';
                                restoreTypewriterAfter(300);
                            }
                        }
                        e.preventDefault(); return;
                    } else {
                        l2_priorityDoubleTimer = setTimeout(()=>{ l2_priorityDoubleTimer=null; }, 500);
                        if(targetText[currentIndex] !== '-'){ e.preventDefault(); return; }
                    }
                }
            }
            if(key !== '+' && key !== '-'){
                if(l2_priorityDoubleTimer){ clearTimeout(l2_priorityDoubleTimer); l2_priorityDoubleTimer=null; }
            }
            if(key !== '>'){ if(l2_expandTimer){ clearTimeout(l2_expandTimer); l2_expandTimer=null; } }
            if(key !== '<'){ if(l2_contextTimer){ clearTimeout(l2_contextTimer); l2_contextTimer=null; } }

            if(key==='Backspace'){
                e.preventDefault();
                if(state.waitingForExclusion){
                    state.waitingForExclusion=false;
                    if(state.exclusionTimer){ clearTimeout(state.exclusionTimer); state.exclusionTimer=null; }
                    generateNextLine(); return;
                }
                state.questionCount=0;
                if(isErrorState){
                    isErrorState=false; currentTypedString=currentTypedString.slice(0,-1); updateTypewriterDisplay();
                } else if(currentIndex>0){
                    currentIndex--; currentTypedString=currentTypedString.slice(0,-1); updateTypewriterDisplay();
                }
                updateSourceSheetStyles(); return;
            }

            if(key==='Enter' || key==='Tab'){ e.preventDefault(); return; }
            if(key.length!==1)return;

            if(key==='?' && currentIndex===0 && !state.waitingForExclusion){
                state.questionCount++;
                if(state.questionCount===1){ currentTypedString='?'; typewriterRow.textContent='?'; return; }
                else if(state.questionCount===2){
                    if(state.currentWordObj){
                        const hint = effectiveMode === 'passive' ? state.currentWordObj.target : state.currentWordObj.source;
                        typewriterRow.innerHTML=`💡 HINT: <strong class="hint-text">${escapeHtml(hint)}</strong> | Type the word...`;
                        statusContent.textContent='Hint shown (priority unchanged)';
                        state.questionCount=0; currentTypedString=''; updateSourceSheetStyles(); return;
                    }
                }
                return;
            }
            if(state.questionCount>0 && key!=='?'){
                state.questionCount=0;
                if(currentTypedString==='?') currentTypedString='';
            }
            if(state.waitingForExclusion){
                if(key==='.'){
                    if(currentTypedString===''){
                        currentTypedString='.'; typewriterRow.textContent=`✅ ${targetText} | Press '.' to exclude`; return;
                    } else if(currentTypedString==='.'){
                        if(state.currentWordObj){
                            const idx=state.pool.indexOf(state.currentWordObj);
                            if(idx>-1)state.pool.splice(idx,1);
                            state.removed++;
                            if(state.extraSlots>0)state.extraSlots--;
                            updateRecallCirculation(effectiveMode);
                            updateProgressBar(getL2Progress(effectiveMode));
                            typewriterRow.textContent=`🗑️ Excluded! (${getL2Remaining(effectiveMode)} left)`;
                            if(state.exclusionTimer){ clearTimeout(state.exclusionTimer); state.exclusionTimer=null; }
                            state.waitingForExclusion=false;
                            setTimeout(generateNextLine,500);
                        }
                        return;
                    }
                }
                state.waitingForExclusion=false;
                if(state.exclusionTimer){ clearTimeout(state.exclusionTimer); state.exclusionTimer=null; }
                generateNextLine(); return;
            }
            if(currentTypedString==='?' && key!=='?'){
                currentTypedString=''; errorCount++; totalKeystrokes++;
            }
            if(!startTime) startTime=Date.now();
            const expected = targetText[currentIndex];
            totalKeystrokes++;

            if(!isErrorState && key===expected){
                currentIndex++; currentTypedString+=key; updateTypewriterDisplay();
                if(currentIndex>=targetText.length){
                    correctCounts[L2_ACTIVE_MODE]++;
                    updateCorrectDisplay();
                    if(state.currentWordObj) speak(state.currentWordObj.source);
                    const word=state.currentWordObj;
                    if(word){
                        const idx=state.pool.indexOf(word);
                        if(idx>-1){ state.pool.splice(idx,1); state.pool.push(word); }
                        state.waitingForExclusion=true; currentTypedString=''; state.questionCount=0;
                        typewriterRow.textContent=`✅ ${targetText} | Press '..' to exclude`;
                        if(state.exclusionTimer) clearTimeout(state.exclusionTimer);
                        state.exclusionTimer=setTimeout(()=>{ state.waitingForExclusion=false; state.exclusionTimer=null; generateNextLine(); },800);
                    }
                    updateSourceSheetStyles(); calculateTelemetryMetrics(); return;
                }
            } else {
                if(!isErrorState){
                    isErrorState=true;
                    if(expected!==' ')errorCount++;
                    currentTypedString+=key; updateTypewriterDisplay();
                } else return;
            }
            updateSourceSheetStyles(); calculateTelemetryMetrics();
        }

        // ============================================================
        // DISPATCHER + GLOBAL KEYDOWN
        // ============================================================
        const MODIFIER_KEYS = ['Shift','Control','Alt','AltGraph','Meta','CapsLock','Fn','FnLock','Hyper','Super','Symbol','SymbolLock','OS'];

        function dispatchKey(e, overrideKey = null){
            if(L2_ACTIVE_MODE === 'drill'){ handleDrillKeydown(e, overrideKey); return; }
            if(L2_ACTIVE_MODE === 'speak'){ handleSpeakKeydown(e, overrideKey); return; }
            handleRecallKeydown(e, overrideKey);
        }

        // Shared by the physical keyboard (window keydown) and the mobile hidden input
        function handleGlobalKeydown(e){
            const key = e.key;

            if(L2_ACTIVE_MODE === 'typing'){
                handleTypingKeydown(e);
                return;
            }

            if(L2_ACTIVE_MODE === 'speak'){
                if(MODIFIER_KEYS.includes(key)) return;
                if(key === 'Tab'){ e.preventDefault(); return; }
                dispatchKey(e);
                return;
            }

            if(key === 'Backspace' && pendingDeadKey){
                pendingDeadKey = null; e.preventDefault(); return;
            }
            if(pendingDeadKey){
                if(key.length === 1 && key.match(/[a-zA-Z]/)){
                    const combo = DEAD_KEY_MAP[pendingDeadKey];
                    if(combo && combo[key]){
                        const combined = combo[key];
                        pendingDeadKey = null; e.preventDefault();
                        dispatchKey(e, combined); return;
                    } else { pendingDeadKey = null; }
                } else if(DEAD_KEYS.includes(key)){
                    const dead = pendingDeadKey;
                    pendingDeadKey = null; e.preventDefault();
                    dispatchKey(e, dead);
                    pendingDeadKey = key; e.preventDefault(); return;
                } else if(MODIFIER_KEYS.includes(key)){
                    return;
                } else { pendingDeadKey = null; }
            }
            if(DEAD_KEYS.includes(key) && !pendingDeadKey){
                if(currentIndex < targetText.length && targetText[currentIndex] === key){
                    // the literal character is expected here – type it directly
                } else { pendingDeadKey = key; e.preventDefault(); return; }
            }

            if(key === 'Enter' && (L2_ACTIVE_MODE === 'passive' || L2_ACTIVE_MODE === 'active' || L2_ACTIVE_MODE === 'random')){
                const state = L2_ACTIVE_MODE === 'random'
                    ? (currentEffectiveMode === 'passive' ? L2_PASSIVE : L2_ACTIVE)
                    : (L2_ACTIVE_MODE === 'passive' ? L2_PASSIVE : L2_ACTIVE);
                if(state.completed){
                    state.completed = false;
                    if(L2_ACTIVE_MODE === 'passive') initL2Passive();
                    else if(L2_ACTIVE_MODE === 'active') initL2Active();
                    else { initL2Passive(); initL2Active(); }
                    generateNextLine();
                    e.preventDefault(); return;
                }
            }
            if(key === 'Tab'){ e.preventDefault(); return; }
            dispatchKey(e);
        }

        window.addEventListener('keydown', function(e){
            // While the hidden mobile input has focus it routes the keys itself (see below)
            if(document.activeElement === mobileKeyCapture) return;
            handleGlobalKeydown(e);
        });

        // ============================================================
        // MOBILE KEYBOARD SUPPORT
        // ============================================================
        // The virtual keyboard opens only when the user taps the typing area
        function focusMobileInput(){
            try { mobileKeyCapture.focus({ preventScroll: true }); } catch(e){ try { mobileKeyCapture.focus(); } catch(e2){} }
        }
        displaySheet.addEventListener('click', focusMobileInput);
        typewriterRow.addEventListener('click', focusMobileInput);
        speakInputWindow.addEventListener('click', focusMobileInput);

        function sendKey(key){ handleGlobalKeydown({ key, preventDefault(){} }); }

        // Backspace / Enter / Tab arrive reliably as keydown, even on mobile
        mobileKeyCapture.addEventListener('keydown', function(e){
            if(e.key === 'Backspace' || e.key === 'Enter' || e.key === 'Tab'){
                e.preventDefault();
                sendKey(e.key);
            }
        });

        // Characters: the input event is the most reliable across mobile keyboards
        mobileKeyCapture.addEventListener('input', function(e){
            const val = this.value;
            this.value = '';
            if(e.inputType === 'deleteContentBackward'){ sendKey('Backspace'); return; }
            if(!val) return;
            sendKey(val[val.length - 1]);
        });

        // ============================================================
        // SPEAK ACTION BAR BUTTONS
        // ============================================================
        micBtn.addEventListener('click', function(){ if(L2_ACTIVE_MODE === 'speak') startListening(); });
        revealBtn.addEventListener('click', function(){ if(L2_ACTIVE_MODE === 'speak') revealSpeakAnswer(); });
        dropBtn.addEventListener('click', function(){ if(L2_ACTIVE_MODE === 'speak') executeSpeakDrop(); });
        nextBtn.addEventListener('click', function(){ if(L2_ACTIVE_MODE === 'speak') nextSpeakPair(); });

        // ============================================================
        // RADIO EVENTS
        // ============================================================
        function switchMode(mode){
            cancelOngoingSpeech();
            pendingDeadKey = null;
            L2_ACTIVE_MODE = mode;
            updateModeUI();
            resetTelemetryState();
            showTranslation(null);
            sourceTextContainer.classList.remove('recall-mode');
            sourceTextContainer.style.color = '';

            if(mode === 'speak'){
                if(L2_TEST_PAIRS.length > 0 && L2_SPEAK.pool.length === 0 && L2_SPEAK.reservoir.length === 0) initSpeak();
            }
            if(mode === 'drill'){
                if(L2_TEST_PAIRS.length > 0 && !DRILL_COMPLETED && DRILL_QUEUE.length === 0 && DRILL_PHASE === 0) initDrill();
            }
            generateNextLine();
        }

        radioTyping.addEventListener('change', function(){ if(this.checked) switchMode('typing'); });
        radioDrill.addEventListener('change', function(){ if(this.checked) switchMode('drill'); });
        radioPassive.addEventListener('change', function(){ if(this.checked) switchMode('passive'); });
        radioActive.addEventListener('change', function(){ if(this.checked) switchMode('active'); });
        radioRandom.addEventListener('change', function(){ if(this.checked) switchMode('random'); });
        radioSpeak.addEventListener('change', function(){ if(this.checked) switchMode('speak'); });

        // ============================================================
        // DEAD KEYS REFERENCE TABLE
        // ============================================================
        function renderDeadKeysTable(){
            const table = document.getElementById('deadKeysTable');
            if(!DEAD_KEYS.length){ table.style.display = 'none'; return; }

            document.getElementById('deadKeysTitle').textContent = `${TARGET_LANG_NAME} Dead Keys Reference`;
            const overrides = DEAD_KEY_ACCENT_OVERRIDES[TARGET_LANG_CODE] || {};
            document.getElementById('deadKeysBody').innerHTML = DEAD_KEYS.map(dk => {
                const info = DEAD_KEY_INFO[dk] || { name: dk, accent: '' };
                const combos = DEAD_KEY_MAP[dk];
                const lower = Object.keys(combos).filter(k => k === k.toLowerCase()).map(k => combos[k]);
                const upper = Object.keys(combos).filter(k => k !== k.toLowerCase()).map(k => combos[k]);
                const examples = upper.length ? `${lower.join(', ')} / ${upper.join(', ')}` : lower.join(', ');
                return `<tr>
                    <td>${escapeHtml(info.name)}</td>
                    <td><span class="key-symbol">${escapeHtml(dk)}</span></td>
                    <td>${escapeHtml(overrides[dk] || info.accent)}</td>
                    <td>${escapeHtml(examples)}</td>
                </tr>`;
            }).join('');
        }

        // ============================================================
        // START
        // ============================================================
        function readLaunchSource(){
            // One-shot flag set by Match Pairs / Dialogue Practice; kept per tab so a reload keeps the same deck
            let source = null;
            try {
                source = localStorage.getItem('typeit_source');
                localStorage.removeItem('typeit_source');
                if(source) sessionStorage.setItem('typeit_source', source);
                else source = sessionStorage.getItem('typeit_source');
            } catch(e){}
            return source || 'direct';
        }

        (async function startTypeIt(){
            TYPEIT_SOURCE = readLaunchSource();

            if(!speechSupported){
                micBtn.disabled = true;
                micBtn.title = 'Speech recognition not available in this browser';
            }

            renderDeadKeysTable();
            initTTS();
            initRecognition();
            L2_ALL_PAIRS=[];
            L2_TEST_PAIRS=[];
            L2_TYPING_ITEMS=[];
            sourceText='';
            targetText='';
            resetCorrectCounter();
            updateModeUI();
            initTyping();
            generateNextTypingLine();   // shows the loading state

            await Promise.all([autoLoadTypingItems(), loadPairsForContext()]);

            resetCorrectCounter();
            initTyping();
            initL2Passive();
            initL2Active();
            initDrill();
            initSpeak();
            updateModeUI();
            generateNextLine();
        })();
    </script>
</body>
