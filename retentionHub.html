<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retention Hub</title>

  <link rel="stylesheet" href="./styles/navBar.style.css" />
  <link rel="stylesheet" href="./styles/toast.style.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>

  <script src="./constant.js"></script>
</head>

<body>

  <nav id="mobile-navbar" class="navbar navbar-expand-lg" style="background-color: #00569D;">
    <div style="display: flex; width: 100%; align-items: center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer;" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>
      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px; margin-bottom: 0;">Retention
        Hub</a>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>
  <div id="snackbar"></div>

  <div style="max-width: 500px; margin: auto; padding: 20px;">

    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; color: #888; margin-bottom: 4px; display: block;">Source</label>
      <input type="text" id="rd-source" disabled style="
        width: 100%;
        background-color: lightblue;
        border: none;
        padding: 10px;
        font-size: 15px;
        color: black;
        border-radius: 4px;
      " />
    </div>

    <div style="margin-bottom: 14px;">
      <label style="font-size: 12px; color: #888; margin-bottom: 4px; display: block;">Target</label>
      <input type="text" id="rd-target" disabled style="
        width: 100%;
        background-color: lightblue;
        border: none;
        padding: 10px;
        font-size: 15px;
        color: black;
        border-radius: 4px;
      " />
    </div>

    <hr style="margin: 18px 0;" />

    <div style="display: flex; align-items: center; margin-bottom: 12px;">
      <label style="font-size: 13px; color: #555; min-width: 100px; margin: 0;">Stats</label>
      <span id="rd-stats" style="
        background: #e9ecef;
        padding: 5px 12px;
        border-radius: 4px;
        font-size: 14px;
        font-family: monospace;
        color: #333;
      ">—</span>
    </div>

    <div style="display: flex; align-items: center; margin-bottom: 12px;">
      <label style="font-size: 13px; color: #555; min-width: 100px; margin: 0;">Probability</label>
      <span id="rd-probability" style="font-size: 14px; color: #333;">—</span>
    </div>

    <div style="display: flex; align-items: center; margin-bottom: 12px;">
      <label style="font-size: 13px; color: #555; min-width: 100px; margin: 0;">Status</label>
      <span id="rd-status" style="font-size: 14px; font-weight: 600;">—</span>
    </div>

    <p id="rd-error" style="display: none; color: #888; margin-top: 30px; text-align: center;">
      Record not found.
    </p>

  </div>

  <script src="./src/retentionHub.js"></script>
  <script src="./src/displayToast.js"></script>

</body>

</html>
