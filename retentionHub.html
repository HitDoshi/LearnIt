<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retention Hub</title>

  <link rel="stylesheet" href="./styles/navBar.style.css" />
  <link rel="stylesheet" href="./styles/toast.style.css" />
  <link rel="stylesheet" href="./styles/retentionHub.style.css" />
  <link rel="stylesheet" href="./styles/ai.style.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>

  <script src="./constant.js"></script>
</head>

<body>

  <nav id="mobile-navbar" class="navbar navbar-expand-lg" style="background-color: #00569D;">
    <div style="display: flex; width: 100%; align-items: center;">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer;" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>
      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px; margin-bottom: 0;">Retention
        Hub</a>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>
  <div id="snackbar"></div>

  <div class="rh-container">

    <div class="rh-field-row">
      <label class="rh-field-label">Source</label>
      <input type="text" id="rd-source" disabled class="rh-field-input" />
    </div>

    <div class="rh-field-row">
      <label class="rh-field-label">Target</label>
      <input type="text" id="rd-target" disabled class="rh-field-input" />
    </div>

    <hr class="rh-divider" />

    <div class="rh-stat-row">
      <label class="rh-stat-label">Stats</label>
      <span id="rd-stats" class="rh-stat-badge">—</span>
    </div>

    <div class="rh-stat-row">
      <label class="rh-stat-label">Probability</label>
      <span id="rd-probability" class="rh-stat-value">—</span>
      <span style="color: #ccc; margin: 0 8px;">|</span>
      <span id="rd-status" class="rh-stat-value" style="font-weight: 600;">—</span>
    </div>

    <p id="rd-error" style="display: none; color: #888; margin-top: 30px; text-align: center;">
      Record not found.
    </p>

    <div id="mnemonic-section" style="display: none;">

      <hr class="rh-divider" />

      <div class="input-section">
        <label class="input-label">Mnemonic Association</label>
        <textarea id="mnem-text-area" placeholder="Mnemonic text will appear here after generation, or type your own…"
          rows="4"></textarea>
      </div>

      <div class="action-row" id="mnem-text-actions">
        <button type="button" class="btn-secondary-action" id="mnem-generate-btn">
          <span id="mnem-generate-spinner" class="rh-spinner" style="display:none;"></span>
          Generate
        </button>
        <button type="button" class="btn-save" id="mnem-text-save-btn" disabled>
          <span id="mnem-text-save-spinner" class="rh-spinner" style="display:none;"></span>
          Save Text
        </button>
      </div>

      <hr class="rh-divider" />

      <div class="input-section">
        <label class="input-label">Mnemonic Image</label>

        <div class="rh-img-placeholder" id="mnem-img-placeholder">
          Generate a mnemonic text first, then create its visual here.
        </div>

        <img class="rh-img-display" id="mnem-img-display" src="" alt="Mnemonic visual" style="display: none;" />
      </div>

      <div class="action-row" id="mnem-img-actions">
        <button type="button" class="btn-secondary-action" id="mnem-img-generate-btn" disabled>
          <span id="mnem-img-generate-spinner" class="rh-spinner" style="display:none;"></span>
          Generate Image
        </button>
        <button type="button" class="btn-save" id="mnem-img-save-btn" disabled>
          <span id="mnem-img-save-spinner" class="rh-spinner" style="display:none;"></span>
          Save Image
        </button>
      </div>

    </div>

  </div>

  <script src="./src/retentionHub.js"></script>
  <script src="./src/displayToast.js"></script>

</body>

</html>
