<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Dialogue</title>

    <!-- Add your stylesheet -->
    <link rel="stylesheet" href="./styles/navBar.style.css" />
    <link rel="stylesheet" href="./styles/table.style.css" />
    <link rel="stylesheet" href="./styles/toast.style.css" />
    <link rel="stylesheet" href="./styles/manageDialogue.css" />
    <link rel="stylesheet" href="./styles/editSentencesModal.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script
      src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="./constant.js"></script>
  </head>

  <body>
    <nav
      id="mobile-navbar"
      class="navbar navbar-expand-lg"
      style="background-color: #00569d"
    >
      <div style="display: flex; width: 100%">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="white"
          class="bi bi-arrow-left-short"
          style="align-self: center; margin-right: 5px; cursor: pointer"
          id="backButton"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"
          />
        </svg>

        <a
          class="navbar-brand"
          style="color: white; align-self: center; font-size: 20px"
          >Manage Dialogue</a
        >
      </div>
    </nav>

    <div class="toast-container" id="toastContainer"></div>
    <div id="snackbar"></div>

    <div class="table-container">
      <table id="dataTable" style="margin-bottom: 20px">
        <thead>
          <tr>
            <th style="text-align: center">Dialogue ID</th>
            <th style="width: max-content; text-align: center">Dialogue</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data will be populated here -->
        </tbody>
      </table>
    </div>

    <!-- Sentences Editing Modal Component -->
    <div class="modal fade" id="editSentencesModal" tabindex="-1">
      <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="selectedDialogueLabel">
              Select a dialogue to edit sentences
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="sentences-toolbar">
              <div class="sentences-title">
                <p id="selectedDialogueMeta" class="sentences-meta">
                  Click a dialogue row above to load its sentences.
                </p>
              </div>
              <div class="sentences-actions">
                <button
                  id="discardChangesBtn"
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  disabled
                >
                  Discard changes
                </button>
                <button
                  id="saveSentencesBtn"
                  type="button"
                  class="btn btn-primary btn-sm"
                  disabled
                >
                  Save changes
                </button>
              </div>
            </div>

            <div class="table-container sentences-table-container">
              <table id="sentencesTable" class="table table-sm table-bordered">
                <thead></thead>
                <tbody>
                  <tr>
                    <td class="text-center">No dialogue selected</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div id="sentencesLoading" class="loading-backdrop d-none">
              <div class="loading-box">
                <div class="spinner-border spinner-border-sm" role="status"></div>
                <span class="ml-2">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./src/manageDialogue.js"></script>
    <script src="./src/editSentencesModal.js"></script>
    <script src="./src/displayToast.js"></script>
  </body>
</html>
