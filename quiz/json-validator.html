<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSON Paste / Parse / Validate</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="./styles/toast.style.css" />
    <link rel="stylesheet" href="./styles/navBar.style.css" />
    <link rel="stylesheet" href="./styles/loader.style.css" />

    <style>
      body {
        background: #f7f9fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        margin-bottom: 20px;
      }
      .monospace {
        font-family: ui-monospace, Menlo, Monaco, "Roboto Mono", monospace;
      }
      .error-snippet {
        background: #fff5f5;
        border: 1px solid #ffcccc;
        padding: 8px;
        border-radius: 6px;
      }
      table th,
      table td {
        font-size: 14px;
        vertical-align: top;
        padding: 6px;
      }
    </style>
  </head>

  <body>
    <nav
      id="mobile-navbar"
      class="navbar navbar-expand-lg"
      style="background-color: #00569d; margin-bottom: 20px"
    >
      <div style="display: flex; width: 100%">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          fill="white"
          class="bi bi-arrow-left-short"
          style="align-self: center; margin-right: 5px; cursor: pointer"
          id="backButton"
          viewBox="0 0 16 16"
        >
          <path
            fill-rule="evenodd"
            d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"
          />
        </svg>

        <a
          class="navbar-brand"
          style="color: white; align-self: center; font-size: 20px"
          >JSON Parser</a
        >
      </div>
    </nav>

    <div class="container mt-3">
      <h3>JSON Paste / Parse / Validate</h3>
      <p class="text-muted">
        Paste JSON below. If valid, you can save or preview it.
      </p>

      <!-- INPUT -->
      <label class="form-label">JSON Input</label>
      <textarea
        id="jsonInput"
        rows="16"
        class="form-control monospace"
        placeholder="Paste JSON here..."
      ></textarea>

      <!-- BUTTONS -->
      <div class="mt-2 d-flex flex-wrap">
        <button id="parseBtn" class="btn btn-primary me-2 mb-2">Parse</button>
        <button id="prettyBtn" class="btn btn-outline-secondary me-2 mb-2">
          Pretty-print
        </button>
        <button id="copyBtn" class="btn btn-outline-success me-2 mb-2">
          Copy Parsed Output
        </button>
        <button id="previewBtn" class="btn btn-info me-2 mb-2" disabled>
          Show Preview
        </button>
        <button id="saveBtn" class="btn btn-success me-2 mb-2" disabled>
          Save
        </button>
        <button id="clearBtn" class="btn btn-outline-danger me-2 mb-2">
          Clear
        </button>
      </div>

      <!-- STATUS -->
      <div id="status" class="mt-3"></div>

      <!-- ERROR ONLY -->
      <div id="errorBox" style="display: none" class="mt-2"></div>
    </div>

    <!-- PREVIEW MODAL -->
    <div class="modal fade" id="previewModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Dialogue Preview</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div id="headerSection"></div>
            <div class="table-responsive mt-3">
              <table id="dialogueTable" class="table table-bordered"></table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Modal -->

    <div class="modal fade" id="modal-loading" data-backdrop="static">
      <div
        class="modal-dialog modal-sm modal-dialog-centered"
        style="max-width: 150px; margin: 0 auto"
      >
        <div class="modal-content">
          <div
            class="modal-body text-center"
            style="
              display: flex;
              flex-direction: row;
              align-items: center;
              justify-content: center;
              gap: 12px;
            "
          >
            <div class="loading-spinner"></div>
            <div>Loading</div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <div id="snackbar"></div>

    <script src="./src/displayToast.js"></script>
    <script src="./constant.js"></script>

    <script>
      const jsonInput = document.getElementById("jsonInput");
      const parseBtn = document.getElementById("parseBtn");
      const previewBtn = document.getElementById("previewBtn");
      const saveBtn = document.getElementById("saveBtn");
      const prettyBtn = document.getElementById("prettyBtn");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");

      const statusEl = document.getElementById("status");
      const errorBox = document.getElementById("errorBox");

      let isJsonValid = false;
      let parsedJSON = null;

      /* UTILITIES */
      function showStatus(html, type = "info") {
        statusEl.innerHTML = `<div class="alert alert-${type} py-2 mb-2">${html}</div>`;
      }
      function clearUI() {
        errorBox.style.display = "none";
        errorBox.innerHTML = "";
        statusEl.innerHTML = "";
      }

      function indexToLineCol(text, index) {
        const part = text.slice(0, index);
        const lines = part.split(/\r\n|\n|\r/);
        return { line: lines.length, col: lines[lines.length - 1].length + 1 };
      }
      function snippetAt(text, index, context = 40) {
        const start = Math.max(0, index - context);
        const end = Math.min(text.length, index + context);
        return {
          before: text.slice(start, index),
          errorChar: text[index] || "",
          after: text.slice(index + 1, end),
        };
      }
      function escapeHtml(s) {
        return s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c])
        );
      }

      function parseJSONWithPosition(text) {
        try {
          return { ok: true, value: JSON.parse(text) };
        } catch (e) {
          const match = e.message.match(/position (\d+)/);
          return {
            ok: false,
            message: e.message,
            position: match ? parseInt(match[1], 10) : null,
          };
        }
      }

      function renderError(text, pos, message) {
        const { line, col } = indexToLineCol(text, pos ?? 0);
        const sn = snippetAt(text, pos ?? 0);

        errorBox.style.display = "block";
        errorBox.innerHTML = `
          <div class="error-snippet">
            <strong>Syntax error:</strong> ${escapeHtml(message)}<br>
            <small>Line <b>${line}</b>, Column <b>${col}</b></small>
            <pre class="monospace mt-2">${escapeHtml(sn.before)}
<span style="background:#ffd2d2">${escapeHtml(sn.errorChar)}</span>${escapeHtml(
          sn.after
        )}</pre>
          </div>`;
      }

      /* PARSE */
      parseBtn.addEventListener("click", () => {
        try {
          clearUI();

          const text = jsonInput.value.trim();
          if (!text) {
            showStatus("No JSON provided.", "danger");
            saveBtn.disabled = true;
            previewBtn.disabled = true;
            return;
          }

          const parsed = parseJSONWithPosition(text);
          if (!parsed.ok) {
            showStatus("Invalid JSON!", "danger");
            renderError(text, parsed.position, parsed.message);
            saveBtn.disabled = true;
            previewBtn.disabled = true;
            return;
          }

          parsedJSON = parsed.value;
          isJsonValid = true;

          saveBtn.disabled = false;
          previewBtn.disabled = false;

          showStatus("JSON is valid!", "success");
        } catch (err) {
          showToast("Error while parsing JSON!" + err?.message);
        }
      });

      /* PRETTY PRINT */
      prettyBtn.addEventListener("click", () => {
        try {
          parseBtn.click();
          jsonInput.value = JSON.stringify(
            JSON.parse(jsonInput.value),
            null,
            2
          );
          showStatus("Pretty printed.", "success");
        } catch (err) {
          showToast("Pretty print failed!" + err?.message);
        }
      });

      /* COPY */
      copyBtn.addEventListener("click", async () => {
        if (!parsedJSON) return showStatus("Parse first.", "danger");
        await navigator.clipboard.writeText(
          JSON.stringify(parsedJSON, null, 2)
        );
        showStatus("Copied!", "success");
      });

      /* CLEAR */
      clearBtn.addEventListener("click", () => {
        try {
          jsonInput.value = "";
          parsedJSON = null;
          isJsonValid = false;
          saveBtn.disabled = true;
          previewBtn.disabled = true;
          clearUI();
        } catch (err) {
          showToast("Clear failed!" + err?.message);
        }
      });

      /* SHOW PREVIEW MODAL + TABLE BUILD */
      previewBtn.addEventListener("click", () => {
        try {
          if (!parsedJSON) return;

          buildHeader(parsedJSON);
          buildTable(parsedJSON);

          const modal = new bootstrap.Modal(
            document.getElementById("previewModal")
          );
          modal.show();
        } catch (err) {
          showToast("Preview failed!" + err?.message);
        }
      });

      function buildHeader(json) {
        try {
          document.getElementById("headerSection").innerHTML = `
      <div class="p-3 border rounded">
        <b>Level ID:</b> ${json?.dialogue_level}<br>
        <b>Topic ID:</b> ${json?.topic_id} - ${json?.topic_desc}<br>
        <b>Dialogue ID:</b> ${json?.dialogue_id} - ${json?.dialogue_desc}<br>
        <b>Total Sentences:</b> ${json?.sentences_count}
      </div>`;
        } catch (err) {
          showToast("Header build error!" + err?.message);
        }
      }

      function buildTable(json) {
        try {
          const table = document.getElementById("dialogueTable");
          table.innerHTML = "";

          const languages = json?.languages?.map((l) => l?.language) ?? [];

          const safe = (v) =>
            !v
              ? `<span class="text-danger" style="font-weight: bold">---</span>`
              : v;

          let header = `
      <thead><tr>
        <th>Sentence ID</th>
        <th>Speaker</th>
    `;

          languages?.forEach((lang) => {
            header += `
        <th>${lang}<br>Text</th>
        <th>${lang}<br>Roman</th>
        <th>${lang}<br>Vocabulary</th>`;
          });

          header += `</tr></thead>`;
          table.innerHTML += header;

          let body = "<tbody>";

          json?.dialogue_sequence?.forEach((row) => {
            body += `<tr>
        <td>${safe(row?.sentence_id)}</td>
        <td>${safe(row?.speaker)}</td>
      `;

            json?.languages?.forEach((lang) => {
              const s = lang?.sentences?.find(
                (x) => x?.sentence_id === row?.sentence_id
              );

              body += `
          <td>${safe(s?.text)}</td>
          <td>${safe(s?.romanization_text)}</td>
          <td>${safe(s?.vocabulary)}</td>`;
            });

            body += `</tr>`;
          });

          body += "</tbody>";
          table.innerHTML += body;
        } catch (err) {
          showToast("Table build failed!" + err?.message);
        }
      }

      // SAVE API
      saveBtn.addEventListener("click", async () => {
        if (!isJsonValid) return;

        try {
          $("#modal-loading").modal("show");

          await new Promise((resolve) => setTimeout(resolve, 500));

          console.log(jsonInput.value);
          const res = await fetch(API_URL + "/api/save_dialogue.php", {
            method: "POST",
            body: jsonInput.value,
          });

          const data = await res.json();
          if (data?.success) {
            showToast(data.message);
          } else {
            showStatus("Save failed: " + data.error, "danger");
            showToast("Save failed: " + data.error);
          }
        } catch (err) {
          showStatus("API Error: " + err.message, "danger");
          showToast("API Error: " + err.message);
        } finally {
          $("#modal-loading").modal("hide");
        }
      });

      const backButton = document.getElementById("backButton");
      backButton.onclick = function () {
        window.location.href = "ai.html";
      };
    </script>
  </body>
</html>
