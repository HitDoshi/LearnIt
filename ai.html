  <div class="ai-container">
    <div class="lang-row">
      <div class="lang-group">
        <label>Source</label>
        <div id="source-lang-display" class="lang-display-text">--</div>
      </div>
      <div class="lang-arrow">→</div>
      <div class="lang-group">
        <label>Target</label>
        <div id="target-lang-display" class="lang-display-text">--</div>
      </div>
    </div>


    <div class="input-section">
      <label for="units-input" class="input-label">
        Enter 2–8 words/phrases separated by <code>;</code>
      </label>
      <textarea id="units-input" placeholder="e.g. coffee with milk;store;friend;shopping" rows="3"></textarea>
      <div class="input-hint">No punctuation or special characters · Max 3 words per unit</div>
    </div>

    <div class="btn-row">
      <button type="button" class="btn-generate" id="ask-button">
        Generate Dialogue
      </button>
    </div>

    <div id="output-section" class="output-section" style="display:none;">
      <div id="output" class="dialogue-output"></div>

      <div class="action-row" id="action-buttons">
        <button type="button" class="btn-secondary-action" id="create-new-button">
          Create new
        </button>
        <button type="button" class="btn-save" id="save-button">
          Save
        </button>
      </div>
    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div id="snackbar"></div>

  <script></script>

  <script src="./src/displayToast.js"></script>
  <script src="./src/ai.js"></script>
