<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit User Dialogues</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <link rel="stylesheet" href="./styles/navBar.style.css" />
  <link rel="stylesheet" href="./styles/table.style.css" />
  <link rel="stylesheet" href="./styles/toast.style.css" />
  <link rel="stylesheet" href="./styles/manageDialogue.css" />
  <link rel="stylesheet" href="./styles/editSentencesModal.css" />
  <link rel="stylesheet" href="./styles/loader.style.css" />



  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <script src="./constant.js"></script>
</head>

<body>
  <nav id="myNavbar" class="navbar navbar-expand-lg" style="background-color: #00569d">
    <div style="display: flex; flex: 1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>

      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px">Edit Dialogues</a>
    </div>

    <div style="display: flex; align-items: center;">
      <!-- Undo icon: visible when checkboxes are checked -->
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white"
        class="bi bi-reply update-icon" viewBox="0 0 16 16"
        style="align-self: center; margin-right: 12px; cursor: pointer;"
        onclick="undoData();"
        title="Undo selection">
        <path d="M6.598 5.013a.144.144 0 0 1 .202.134V6.3a.5.5 0 0 0 .5.5c.667 0 2.013.005 3.3.822.984.624 1.99 1.76 2.595 3.876-1.02-.983-2.185-1.516-3.205-1.799a8.74 8.74 0 0 0-1.921-.306 7.404 7.404 0 0 0-.798.008h-.013l-.005.001h-.001L7.3 9.9l-.05-.498a.5.5 0 0 0-.45.498v1.153c0 .108-.11.176-.202.134L2.614 8.254a.503.503 0 0 0-.042-.028.147.147 0 0 1 0-.252.499.499 0 0 0 .042-.028l3.984-2.933zM7.8 10.386c.068 0 .143.003.223.006.434.02 1.034.086 1.7.271 1.326.368 2.896 1.202 3.94 3.08a.5.5 0 0 0 .933-.305c-.464-3.71-1.886-5.662-3.46-6.66-1.245-.79-2.527-.942-3.336-.971v-.66a1.144 1.144 0 0 0-1.767-.96l-3.994 2.94a1.147 1.147 0 0 0 0 1.946l3.994 2.94a1.144 1.144 0 0 0 1.767-.96v-.667z"/>
      </svg>

      <!-- Confirm delete (tick) icon: visible when checkboxes are checked -->
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white"
        class="bi bi-check2 update-icon" viewBox="0 0 16 16"
        style="align-self: center; margin-right: 14px; cursor: pointer;"
        onclick="updateData();"
        title="Confirm delete">
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
      </svg>

      <!-- AI stars icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stars"
        viewBox="0 0 16 16" style="align-self: center; margin-right: 10px; color: white; cursor: pointer;"
        onclick="replaceStateWithHistory('ai.html')">
        <path
          d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936a.361.361 0 0 1-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645a.361.361 0 0 1 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.828zM3.794 1.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387A1.73 1.73 0 0 0 4.593 5.69l-.387 1.162a.217.217 0 0 1-.412 0L3.407 5.69A1.73 1.73 0 0 0 2.31 4.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387A1.73 1.73 0 0 0 3.407 2.31zM10.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732L9.1 2.137a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z" />
      </svg>
    </div>
  </nav>


  <div class="toast-container" id="toastContainer"></div>
  <div id="snackbar"></div>

  <div class="table-container">
    <table id="dataTable" style="margin-bottom: 20px; text-align: center;">
      <thead>
        <tr>
          <th style="text-align: center">Dialogue ID</th>
          <th style="width: fit-content; text-align: center">Delete</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be populated here -->
      </tbody>
    </table>
  </div>

  <!-- Sentences Editing Modal Component -->
  <div class="modal fade" id="editSentencesModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="selectedDialogueLabel">
            Select a dialogue to edit sentences
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" data-dismiss="modal"
            aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <div class="sentences-toolbar">
            <div class="sentences-title">
              <p id="selectedDialogueMeta" class="sentences-meta">
                Click a dialogue row above to load its sentences.
              </p>
            </div>
            <div class="sentences-actions">
              <button id="discardChangesBtn" type="button" class="btn btn-outline-secondary btn-sm" disabled>
                Discard changes
              </button>
              <button id="saveSentencesBtn" type="button" class="btn btn-primary btn-sm" disabled>
                Save changes
              </button>
            </div>
          </div>

          <div class="table-container sentences-table-container">
            <table id="sentencesTable" class="table table-sm table-bordered">
              <thead></thead>
              <tbody>
                <tr>
                  <td class="text-center">No dialogue selected</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div id="sentencesLoading" class="loading-backdrop d-none">
            <div class="loading-box">
              <div class="spinner-border spinner-border-sm" role="status"></div>
              <span class="ml-2">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-loading" data-backdrop="static">
    <div class="modal-dialog modal-sm modal-dialog-centered" style="max-width: 150px; margin: 0 auto">
      <div class="modal-content">
        <div class="modal-body text-center" style="
              display: flex;
              flex-direction: row;
              align-items: center;
              justify-content: center;
              gap: 12px;
            ">
          <div class="loading-spinner"></div>
          <div>Loading</div>
        </div>
      </div>
    </div>
  </div>


  <script src="./src/manageUserDialogue.js"></script>
  <script src="./src/editSentencesModal.js"></script>
  <script src="./src/displayToast.js"></script>
</body>

</html>
