<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Dialogues</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />

  <link rel="stylesheet" href="../quiz/styles/navBar.style.css" />
  <link rel="stylesheet" href="../quiz/styles/toast.style.css" />
  <link rel="stylesheet" href="../quiz/styles/loader.style.css" />
  <link rel="stylesheet" href="./styles/admin.style.css" />

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <script src="../quiz/constant.js"></script>
</head>

<body>
  <nav id="myNavbar" class="navbar navbar-expand-lg" style="background-color: #00569d">
    <div style="display: flex; flex: 1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>

      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px">Manage Dialogues</a>
    </div>

    <a class="nav-action" href="../quiz/json-validator.html?from=admin"><i class="fa fa-upload"></i> Import JSON</a>
  </nav>

  <div id="snackbar"></div>

  <div class="admin-container">
    <div class="admin-toolbar">
      <select id="levelFilter" class="custom-select">
        <option value="">All levels</option>
      </select>
      <select id="topicFilter" class="custom-select" disabled>
        <option value="">All topics</option>
      </select>
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" id="dialogueSearch" class="form-control" placeholder="Search by ID or description" />
      </div>
      <span class="admin-count" id="dialogueCount"></span>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="dialoguesTable">
        <thead>
          <tr>
            <th style="width: 130px">Dialogue ID</th>
            <th>Description</th>
            <th style="width: 100px">Sentences</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="dialogueEditorModal" tabindex="-1" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-xl" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Dialogue <span id="editorDialogueId"></span></h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <div class="editor-meta" id="editorMeta"></div>

          <div class="form-group">
            <label for="dialogueDescInput" class="small font-weight-bold text-muted">Description</label>
            <input type="text" id="dialogueDescInput" class="form-control" />
          </div>

          <div class="chip-group" id="languageChips"></div>
          <div class="chip-group" id="fieldChips"></div>

          <div class="sentences-wrap">
            <table class="admin-table" id="sentencesTable">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <div class="modal-footer">
          <span class="change-count" id="changeCount"></span>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="discardChangesBtn" disabled>
            Discard
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="saveDialogueBtn" disabled>
            <span class="spinner-border spinner-border-sm d-none" id="saveDialogueSpinner"></span>
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteDialogueModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete dialogue</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p class="mb-1">Delete dialogue <strong id="deleteDialogueId"></strong> and all of its sentences?</p>
          <p class="text-muted small mb-0" id="deleteDialogueDesc"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteDialogueBtn">
            <span class="spinner-border spinner-border-sm d-none" id="deleteDialogueSpinner"></span>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-loader d-none" id="adminLoader">
    <div class="loading-spinner"></div>
  </div>

  <script src="../quiz/src/displayToast.js"></script>
  <script src="./src/adminCommon.js"></script>
  <script src="./src/manageDialogues.js"></script>
</body>

</html>
