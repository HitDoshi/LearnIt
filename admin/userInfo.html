<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Info</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />

  <link rel="stylesheet" href="../quiz/styles/navBar.style.css" />
  <link rel="stylesheet" href="../quiz/styles/toast.style.css" />
  <link rel="stylesheet" href="../quiz/styles/loader.style.css" />
  <link rel="stylesheet" href="./styles/admin.style.css" />

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>

  <script src="../quiz/constant.js"></script>
</head>

<body>
  <nav id="myNavbar" class="navbar navbar-expand-lg" style="background-color: #00569d">
    <div style="display: flex; flex: 1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>

      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px">User Info</a>
    </div>
  </nav>

  <div id="snackbar"></div>

  <div class="admin-container">
    <div class="admin-card d-none" id="userNotFound">
      <div class="admin-card-body text-center">
        <p class="mb-3" id="userNotFoundText">User not found.</p>
        <a href="manageUsers.html" class="btn btn-outline-secondary btn-sm">Back to users</a>
      </div>
    </div>

    <div class="d-none" id="userInfoContent">
      <div class="admin-card">
        <div class="admin-card-body user-summary">
          <div class="user-avatar" id="userAvatar"></div>
          <div>
            <h5><span id="summaryName"></span> <span id="summaryType"></span></h5>
            <div class="user-email" id="summaryEmail"></div>
          </div>
        </div>
        <div class="user-stats">
          <div class="user-stat">
            <div class="user-stat-label">Last Accessed</div>
            <div class="user-stat-value" id="statLastAccessed">-</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-label">Words</div>
            <div class="user-stat-value" id="statWords">-</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-label">User Dialogues</div>
            <div class="user-stat-value" id="statDialogues">-</div>
          </div>
          <div class="user-stat">
            <div class="user-stat-label">Mnemonic Images</div>
            <div class="user-stat-value" id="statImages">-</div>
          </div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h6>Settings</h6>
        </div>
        <div class="admin-card-body">
          <form id="settingsForm" autocomplete="off" novalidate>
            <div class="settings-grid" id="settingsFields"></div>
            <div class="flag-list" id="flagFields"></div>
            <div class="form-actions">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="resetSettingsBtn" disabled>
                Reset
              </button>
              <button type="submit" class="btn btn-primary btn-sm" id="saveSettingsBtn" disabled>
                <span class="spinner-border spinner-border-sm d-none" id="saveSettingsSpinner"></span>
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-card-header">
          <h6>Account Details</h6>
        </div>
        <div class="admin-card-body">
          <table class="details-table">
            <tbody id="detailsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-card danger-card" id="deleteUserCard">
        <div class="admin-card-body">
          <p>Deleting this user also removes their words, dialogues and uploaded files. This cannot be undone.</p>
          <button type="button" class="btn btn-outline-danger btn-sm" id="deleteUserBtn">
            <i class="fa fa-trash-o"></i> Delete User
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteUserModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete user</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p class="mb-1">Are you sure you want to delete <strong id="deleteUserName"></strong>?</p>
          <p class="text-muted small mb-0" id="deleteUserEmail"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">
            <span class="spinner-border spinner-border-sm d-none" id="deleteSpinner"></span>
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="admin-loader d-none" id="adminLoader">
    <div class="loading-spinner"></div>
  </div>

  <script src="../quiz/src/displayToast.js"></script>
  <script src="./src/adminCommon.js"></script>
  <script src="./src/userInfo.js"></script>
</body>

</html>
