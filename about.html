<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About</title>

  <link rel="stylesheet" href="./styles/toast.style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
    integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
    integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
    integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
    crossorigin="anonymous"></script>
  <style>
    .personalization-card {
      margin-top: 20px;
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.07);
      padding: 20px;
      background: #fff;
    }

    .personalization-card h5 {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .personalization-hint {
      font-size: 0.88rem;
      color: #555;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    #userContextInput {
      width: 100%;
      min-height: 110px;
      border-radius: 8px;
      border: 1px solid #c8d0da;
      padding: 10px 12px;
      font-size: 0.93rem;
      resize: vertical;
      font-family: inherit;
      color: #222;
      transition: border-color 0.2s;
    }

    #userContextInput:focus {
      outline: none;
      border-color: #00569d;
      box-shadow: 0 0 0 3px rgba(0, 86, 157, 0.12);
    }

    #saveUserContextBtn {
      margin: 12px auto 0 auto;
      background-color: #00569d;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 22px;
      font-size: 0.93rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.18s;
    }

    #saveUserContextBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #saveUserContextBtn:hover:not(:disabled) {
      background-color: #004080;
    }

    /* AI Settings card */
    .ai-settings-card h5 {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .ai-option-label {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 8px;
      margin-top: 14px;
      display: block;
      color: #333;
    }

    .ai-option-label:first-of-type {
      margin-top: 0;
    }

    .ai-option-group {
      display: flex;
      gap: 10px;
    }

    .ai-option-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: 2px solid #dce3ec;
      background: #f5f7fa;
      color: #555;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
    }

    .ai-option-btn:hover {
      border-color: #00569d;
      color: #00569d;
      background: #edf3fa;
    }

    .ai-option-btn.active {
      border-color: #00569d;
      background: #00569d;
      color: #fff;
      font-weight: 600;
    }

    .ai-model-hint {
      margin-top: 14px;
      font-size: 0.83rem;
      color: #777;
      background: #f0f4f8;
      border-radius: 6px;
      padding: 7px 12px;
    }

    .ai-model-hint strong {
      color: #00569d;
    }
  </style>
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh">
  <nav id="myNavbar" class="navbar navbar-expand-lg" style="background-color: #00569d">
    <div style="display: flex; flex: 1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="white" class="bi bi-arrow-left-short"
        style="align-self: center; margin-right: 5px; cursor: pointer" id="backButton" viewBox="0 0 16 16">
        <path fill-rule="evenodd"
          d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z" />
      </svg>

      <a class="navbar-brand" style="color: white; align-self: center; font-size: 20px">About</a>
    </div>
  </nav>

  <div class="container" style="max-width: 500px; margin: auto;margin-top: 20px;">
    <div class="container mt-4">
      <div class="card p-3 shadow-sm">
        <h5>User Information</h5>
        <hr />
        <p><strong>UserID:</strong> <span id="userId"></span></p>
        <p><strong>UserType:</strong> <span id="userType"></span></p>
        <p><strong>MaxUD:</strong> <span id="maxUD"></span></p>
        <p><strong>MaxUD Dialogues:</strong> <span id="maxUDDialogue"></span></p>
        <p><strong>Date:</strong> <span id="currentDate"></span></p>
        <p><strong>Version:</strong> <span id="version"></span></p>
      </div>
    </div>

    <div class="container mt-4">
      <div class="card p-3 shadow-sm">

        <p class="personalization-hint">
          Share a few interests, hobbies, or your profession. We'll customize your
          sample sentences so you learn the language using scenarios that matter to you.
        </p>
        <textarea id="userContextInput"
          placeholder="e.g. I'm a nurse who loves hiking and cooking Italian food..."></textarea>
        <button id="saveUserContextBtn" onclick="saveUserContext()">
          <span id="saveUserContextSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          <span id="saveUserContextBtnText">Save</span>
        </button>

      </div>
    </div>
  </div>
  </div>

  <script src="./constant.js"></script>


  <script>
    const backButton = document.getElementById("backButton");
    backButton.onclick = function () {
      window.location.href = "main.html";
    };

    const userData = JSON.parse(localStorage.getItem("user") || "{}");

    if (userData) {
      document.getElementById("userId").innerText = userData?.id || "-";
      document.getElementById("userType").innerText = userData?.userType || "-";
      document.getElementById("maxUD").innerText = userData?.maxUD || "-";
      document.getElementById("maxUDDialogue").innerText = userData?.maxUDDialogue || "-";

      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const dd = String(today.getDate()).padStart(2, "0");

      const formattedDate = `${yyyy}${mm}${dd}`;
      document.getElementById("currentDate").innerText = formattedDate;

      const version = latestVersionReleasedOn;
      document.getElementById("version").innerText = version;

      if (userData?.user_context) {
        document.getElementById("userContextInput").value = userData.user_context;
      }
    } else {
      console.log("User not found in localStorage");
    }

    async function saveUserContext() {
      const token = localStorage.getItem("token");
      if (!token) {
        showToast("Please log in to save.");
        return;
      }

      const contextText = document.getElementById("userContextInput").value.trim();
      const btn = document.getElementById("saveUserContextBtn");
      const spinner = document.getElementById("saveUserContextSpinner");
      const btnText = document.getElementById("saveUserContextBtnText");

      btn.disabled = true;
      spinner.classList.remove("d-none");
      btnText.textContent = "Saving...";

      try {
        const response = await fetch(`${API_URL}/api/update_user_context.php?token=${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_context: contextText }),
        });
        const data = await response.json();

        if (data?.success) {
          const cachedUser = JSON.parse(localStorage.getItem("user") || "{}");
          cachedUser.user_context = contextText;
          localStorage.setItem("user", JSON.stringify(cachedUser));

          showToast("Saved!");
        } else {
          showToast(data?.message || "Failed to save.");
        }
      } catch (err) {
        console.error(err);
        showToast("Network error. Please try again.");
      } finally {
        btn.disabled = false;
        spinner.classList.add("d-none");
        btnText.textContent = "Save";
      }
    }

  </script>

  <div id="snackbar"></div>
  <script src="./src/displayToast.js"></script>
</body>

</html>
